<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zap — local voice companion</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--dim); font-size:13px; }
  #status { margin-left:auto; font-size:13px; padding:4px 10px; border:1px solid var(--line); border-radius:20px; }
  #status .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--warn); margin-right:6px; }
  #status.live .dot { background:var(--ok); }
  #status.speaking .dot { background:var(--acc); }
  main { display:grid; grid-template-columns: 300px 1fr; gap:14px; padding:14px 18px; max-width:1100px; margin:0 auto; }
  @media (max-width:800px){ main{grid-template-columns:1fr;} }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  button, input[type=text] { font:inherit; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 14px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  button.danger { border-color:#f85149; color:#f85149; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #micBtn.live { border-color:var(--ok); color:var(--ok); }
  #log { height:46vh; min-height:260px; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 11px; border-radius:8px; background:#0d1117; border:1px solid var(--line); }
  .msg.user { border-color:#1f6feb; } .msg.ai { border-color:#3fb950; } .msg.sys { color:var(--dim); font-size:13px; }
  .msg .who { font-size:12px; color:var(--dim); margin-bottom:2px; }
  #composer { display:flex; gap:8px; margin-top:10px; }
  #composer input { flex:1; background:#0d1117; border:1px solid var(--line); border-radius:8px; padding:9px 12px; color:var(--txt); }
  #memHits { font-size:13px; color:var(--dim); display:flex; flex-direction:column; gap:6px; max-height:30vh; overflow:auto; }
  canvas#viz { width:100%; height:64px; background:#0d1117; border:1px solid var(--line); border-radius:8px; }
  label.hf { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--dim); }
  kbd { background:#0d1117; border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>⚡ Zap</h1><span class="sub">100% local duplex companion · ollama + piper/stt + mempalace</span>
  <span id="status"><span class="dot"></span><span id="statusText">connecting…</span></span>
</header>
<main>
  <section class="card">
    <h2>Voice</h2>
    <div class="row">
      <button id="micBtn">🎙 Start mic</button>
      <button id="stopBtn" class="danger" disabled>⏹ Interrupt</button>
    </div>
    <p><label class="hf"><input type="checkbox" id="handsfree" checked /> hands-free (auto stop on silence, barge-in while AI speaks)</label></p>
    <canvas id="viz" width="260" height="64"></canvas>
    <p style="color:var(--dim);font-size:13px">Tip: press <kbd>space</kbd> (hold) for push-to-talk, or just talk. You can interrupt Zap mid-sentence.</p>
    <h2 style="margin-top:14px">Backend</h2>
    <div id="backend" style="font-size:13px;color:var(--dim)">…</div>
    <h2 style="margin-top:14px">Memory hits</h2>
    <div id="memHits"><span>none yet</span></div>
  </section>
  <section class="card">
    <h2>Conversation</h2>
    <div id="log"></div>
    <div id="composer">
      <input id="textIn" type="text" placeholder="Type fallback (works even without mic/models)…" autocomplete="off" />
      <button id="sendBtn" class="primary">Send</button>
    </div>
  </section>
</main>
<script type="module" src="./app.ts"></script>
</body>
</html>
